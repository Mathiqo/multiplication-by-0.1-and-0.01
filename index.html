<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Place Value Explorer</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 750px;
      width: 100%;
      text-align: center;
    }
    .prompt-box {
      background-color: #fff9db;
      border: 2px solid #ffe066;
      padding: 15px;
      border-radius: 8px;
      font-weight: 600;
      color: #5c3c00;
      margin-bottom: 20px;
    }
    .place-table {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 25px;
    }
    .column {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 110px;
    }
    .header {
      font-size: 0.85rem;
      font-weight: bold;
      color: #555;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .header span {
      display: block;
      font-size: 0.75rem;
      color: #888;
      font-weight: normal;
    }
    .slot {
      width: 90px;
      height: 90px;
      border: 2px dashed #ccc;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fafafa;
    }
    .decimal-point {
      font-size: 3rem;
      font-weight: bold;
      color: #e67e22;
      margin: 0 4px;
      align-self: flex-end;
      padding-bottom: 10px;
    }
    .digit-tile {
      width: 75px;
      height: 75px;
      background-color: #0088cc;
      color: white;
      font-size: 2.2rem;
      font-weight: bold;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s, background-color 0.2s;
    }
    .digit-tile:hover {
      transform: scale(1.05);
      background-color: #0077bb;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    .btn {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      transition: background 0.2s;
    }
    .btn-divide { background-color: #e67e22; }
    .btn-divide:hover { background-color: #d35400; }
    .btn-multiply { background-color: #27ae60; }
    .btn-multiply:hover { background-color: #219150; }
    .btn-reset { background-color: #95a5a6; }
    .btn-reset:hover { background-color: #7f8c8d; }

    .value-display {
      font-size: 1.3rem;
      font-weight: bold;
      color: #333;
      padding: 12px;
      background: #eef7fc;
      border-radius: 8px;
      border: 1px solid #bce1f7;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Think, Calculate & Shift Digits Yourself!</h2>
  
  <div class="prompt-box" id="instruction">
    Where does the digit move when you divide by 10? Click "÷ 10" to test your idea!
  </div>

  <div class="place-table">
    <div class="column">
      <div class="header">Hundreds<span>(100)</span></div>
      <div class="slot" data-index="0">
        <div class="digit-tile" id="tile-4">4</div>
      </div>
    </div>

    <div class="column">
      <div class="header">Tens<span>(10)</span></div>
      <div class="slot" data-index="1">
        <div class="digit-tile" id="tile-0a">0</div>
      </div>
    </div>

    <div class="column">
      <div class="header">Ones<span>(1)</span></div>
      <div class="slot" data-index="2">
        <div class="digit-tile" id="tile-0b">0</div>
      </div>
    </div>

    <div class="decimal-point">.</div>

    <div class="column">
      <div class="header">Tenths<span>(0.1)</span></div>
      <div class="slot" data-index="3"></div>
    </div>

    <div class="column">
      <div class="header">Hundredths<span>(0.01)</span></div>
      <div class="slot" data-index="4"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-divide" onclick="shiftRight()">÷ 10 (Shift Right)</button>
    <button class="btn btn-multiply" onclick="shiftLeft()">× 10 (Shift Left)</button>
    <button class="btn btn-reset" onclick="resetBoard()">Reset (400)</button>
  </div>

  <div class="value-display" id="current-value">
    Current Value: 400
  </div>
</div>

<script>
  // Initial positions: [Hundreds, Tens, Ones, Tenths, Hundredths]
  let state = ['4', '0', '0', '', ''];
  const values = [100, 10, 1, 0.1, 0.01];

  function render() {
    const slots = document.querySelectorAll('.slot');
    slots.forEach((slot, index) => {
      slot.innerHTML = '';
      if (state[index] !== '') {
        const tile = document.createElement('div');
        tile.className = 'digit-tile';
        tile.textContent = state[index];
        slot.appendChild(tile);
      }
    });

    calculateValue();
  }

  function calculateValue() {
    let total = 0;
    for (let i = 0; i < state.length; i++) {
      if (state[i] !== '') {
        total += parseInt(state[i]) * values[i];
      }
    }
    // Handle floating point precision issues
    const displayVal = Math.round(total * 100) / 100;
    document.getElementById('current-value').textContent = `Current Value: ${displayVal}`;
  }

  function shiftRight() {
    if (state[4] !== '') {
      document.getElementById('instruction').textContent = "You've reached the rightmost limit!";
      return;
    }
    state.pop();
    state.unshift('');
    document.getElementById('instruction').textContent = "Notice how every digit moves ONE place to the RIGHT, making the value 10 times smaller!";
    render();
  }

  function shiftLeft() {
    if (state[0] !== '') {
      document.getElementById('instruction').textContent = "You've reached the leftmost limit!";
      return;
    }
    state.shift();
    state.push('');
    document.getElementById('instruction').textContent = "Notice how every digit moves ONE place to the LEFT, making the value 10 times larger!";
    render();
  }

  function resetBoard() {
    state = ['4', '0', '0', '', ''];
    document.getElementById('instruction').textContent = "Board reset to 400. Try shifting digits left or right!";
    render();
  }

  // Initial render
  render();
</script>

</body>
</html>
