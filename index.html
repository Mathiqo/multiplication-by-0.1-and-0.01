<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MathIQ - Fractions to Decimals</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7ff;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
        }

        .progress {
            margin: 20px 0;
            font-weight: bold;
        }

        .bar {
            height: 12px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 10%;
            background: #5b6cff;
        }

        .whole {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }

        .part {
            width: 45px;
            height: 70px;
            border: 2px solid #333;
            background: #e8ecff;
        }

        .selected {
            background: #5b6cff;
        }

        .equation {
            font-size: 30px;
            font-weight: bold;
            margin: 30px;
        }

        .question {
            font-size: 20px;
            margin: 25px 0;
        }

        button {
            display: block;
            width: 80%;
            max-width: 400px;
            margin: 12px auto;
            padding: 14px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #eeeeee;
            cursor: pointer;
        }

        button:hover {
            background: #dfe3ff;
        }

        #feedback {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>MathIQ 🧠</h1>

    <div class="progress">
        Lesson 1 of 10
    </div>

    <div class="bar">
        <div class="progress-fill"></div>
    </div>

    <h2>Let's understand 1/10</h2>

    <p>Here is one whole divided into 10 equal parts.</p>

    <div class="whole">
        <div class="part selected"></div>
        <div class="part"></div>
        <div class="part"></div>
        <div class="part"></div>
        <div class="part"></div>
        <div class="part"></div>
        <div class="part"></div>
        <div class="part"></div>
        <div class="part"></div>
        <div class="part"></div>
    </div>

    <p>
        One part out of ten parts is:
    </p>

    <div class="equation">
        1/10 = 0.1
    </div>

    <hr>

    <div class="question">
        🍫 A chocolate bar is divided into 10 equal pieces.
        <br><br>
        You take 1 piece. What decimal part did you take?
    </div>

    <button onclick="checkAnswer(0.01)">0.01</button>
    <button onclick="checkAnswer(0.1)">0.1</button>
    <button onclick="checkAnswer(1)">1.0</button>

    <div id="feedback"></div>

</div>

<script>

function checkAnswer(answer) {

    const feedback = document.getElementById("feedback");

    if (answer === 0.1) {

        feedback.innerHTML = "🎉 Correct! 1/10 = 0.1";

    } else {

        feedback.innerHTML = "💡 Try again. One out of ten is 1/10 = 0.1";

    }

}

</script>

</body>
</html>
